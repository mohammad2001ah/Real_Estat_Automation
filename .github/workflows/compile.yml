name: Compile UI automation
on:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile tests without starting the local app
        run: mvn --batch-mode -DskipTests test
